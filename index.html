<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Породица Гркинић — породично стабло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <p class="eyebrow">породично стабло</p>
    <h1>Гркинић</h1>
    <p class="subtitle">Рамљане, Книн, од средине 19. века до данас</p>
  </header>

  <div class="topbar">
    <div class="toolbar">
      <button id="zoom-out" title="Умањи">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="Увећај">+</button>
      <button id="zoom-reset" title="Врати на средину">◎ центрирај</button>
      <input id="person-search" class="person-search" type="text" list="person-datalist" placeholder="🔎 тражи особу...">
      <datalist id="person-datalist"></datalist>
      <span class="toolbar-hint">превуци мишем да померaш стабло</span>
    </div>
    <div class="scrubber" id="scrubber" title="Превуци да се крећеш кроз стабло">
      <div class="scrubber-track" id="scrubber-track">
        <div class="scrubber-thumb" id="scrubber-thumb"></div>
      </div>
    </div>
  </div>

  <main id="tree-viewport">
    <div id="tree-canvas">
      <svg id="tree-svg"></svg>
      <div id="tree-nodes"></div>
    </div>
  </main>

  <!-- панел са биографијом -->
  <aside id="person-panel" class="person-panel" aria-hidden="true">
    <button id="panel-close" class="panel-close" aria-label="Затвори">×</button>
    <div class="panel-content">
      <div class="panel-photo" id="panel-photo"></div>
      <p class="panel-eyebrow" id="panel-years"></p>
      <h2 id="panel-name"></h2>
      <p class="panel-bio" id="panel-bio"></p>

      <h3 class="gallery-title">Галерија</h3>
      <div id="panel-gallery" class="panel-gallery"></div>
    </div>
  </aside>
  <div id="panel-backdrop" class="panel-backdrop"></div>

  <!-- лајтбокс за галерију -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="lightbox-close" class="lightbox-close" aria-label="Затвори">×</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="data/people.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
